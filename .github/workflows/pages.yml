name: Publicar web en GitHub Pages

on:
  push:
    branches: [claude/football-card-game-repo-q6v9z2, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # El lint avisa pero no bloquea la publicación.
      - name: Lint
        run: npx expo lint
        continue-on-error: true
      - name: Comprobar configuración de cuentas
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            case "$SUPABASE_URL" in
              https://*.supabase.co|https://*.supabase.co/) echo "Cuentas: ACTIVADAS ($SUPABASE_URL)" ;;
              *) echo "::warning::SUPABASE_URL no parece una Project URL de Supabase (https://xxxx.supabase.co): $SUPABASE_URL" ;;
            esac
          else
            echo "::warning::Cuentas DESACTIVADAS: faltan las variables del repositorio SUPABASE_URL y/o SUPABASE_ANON_KEY."
          fi
      - run: npx expo export --platform web
        env:
          # Un repositorio «<cuenta>.github.io» se publica en la raíz; cualquier otro, en /<repositorio>.
          EXPO_BASE_URL: ${{ !endsWith(github.event.repository.name, '.github.io') && format('/{0}', github.event.repository.name) || '' }}
          # Cuentas (opcional): variables del repositorio. Sin ellas, el juego funciona sin cuentas.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Privacidad, condiciones y borrado de cuenta como páginas públicas (las piden las tiendas).
      - run: npm run legal:pages -- dist
      # Manifiesto e iconos para instalar el juego en el móvil desde el navegador.
      - run: npm run pwa -- dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Prueba el esquema de la base de datos contra un PostgreSQL real.
  base-de-datos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
