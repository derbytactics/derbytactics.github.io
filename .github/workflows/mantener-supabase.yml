name: Mantener Supabase despierto

# En el plan gratuito, Supabase pausa el proyecto tras 7 días sin uso y nadie puede entrar.
# Una consulta pequeña al día (el ranking, que es público) lo mantiene activo.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  despertar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el ranking
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Faltan las variables SUPABASE_URL y SUPABASE_ANON_KEY: no hay nada que despertar."
            exit 0
          fi
          for intento in 1 2 3; do
            if curl -fsS -m 30 -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ranking" \
                 -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" \
                 -d '{"p_limit":1}' > /dev/null; then
              echo "Supabase responde."
              exit 0
            fi
            sleep 20
          done
          echo "::error::Supabase no responde. Si el proyecto está pausado, reactívalo desde el panel de Supabase."
          exit 1
